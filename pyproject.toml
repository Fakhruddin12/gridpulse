[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridpulse"
version = "0.1.0"
description = "Leakage-aware Great Britain day-ahead demand forecasting"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "PyYAML>=6.0",
  "requests>=2.31", "joblib>=1.3"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27"]
deep-learning = ["torch>=2.1"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.scripts]
gridpulse = "gridpulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
